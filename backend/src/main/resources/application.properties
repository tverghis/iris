spring.application.name=iris
spring.threads.virtual.enabled=true
# Agent runs
iris.agent-run.dispatch.interval=10m
iris.agent-run.lease.initial-duration=5m
iris.agent-run.lease.extension-duration=30m
iris.agent-run.max-allowed-duration=2h
iris.agent-run.max-attempts=2
iris.agent-run.executor.type=mock
iris.agent-run.notifier.type=none
# Database
iris.db.path=./var/iris.db
